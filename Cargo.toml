[workspace]
resolver = "2"
members = [
    "crates/tkr-api",
    "crates/tkr-filter",
    "crates/tkr-analytics",
    "crates/tkr-session-recorder",
    "crates/tkr-agent",
    "crates/tkr-providers",
    "crates/tkr-sandbox",
    "crates/tkr-server",
    "crates/tkr-mesh",
    "crates/tkr-mcp",
    "crates/tkr",
]

# MSRV — keep in sync with rust-toolchain.toml (transitive crates: time, darling, …).
[workspace.package]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
landlock = "0.4"
tempfile = "3"
regex = "1"
dirs = "5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
ureq = { version = "2", features = ["json"] }
thiserror = "1"
mockito = "1"
age = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
schemars = "0.8"
jsonschema = "0.18"
hex = "0.4"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
rusqlite = { version = "0.39", features = ["bundled", "serialize"] }
sqlite-vec = "0.1"
tar = "0.4"
flate2 = "1"
# Below 1.52: 1.52.x pulls tokio-macros ~2.7; stale crates.io mirrors sometimes lack it.
tokio = { version = ">=1.51.1, <1.52", features = ["rt-multi-thread", "net", "time", "io-util", "sync"] }
hyper = { version = "=1.9.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http = "=1.4.0"
http-body-util = "=0.1.3"
bytes = "=1.11.1"
base64 = "=0.22.1"

[profile.release]
opt-level = 3
# Disabled: fat/thin LTO can fail when linking `tkr` against `cdylib` workspace
# members and bundled C crates (`rusqlite`) — e.g. `cargo install --path crates/tkr`.
lto = false
codegen-units = 1
strip = true
