[workspace]
resolver = "2"
members = [
    "crates/tkr-api",
    "crates/tkr-filter",
    "crates/tkr-semantic",
    "crates/tkr-analytics",
    "crates/tkr-agent",
    "crates/tkr-providers",
    "crates/tkr",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
dirs = "5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
ureq = { version = "2", features = ["json"] }
thiserror = "1"
mockito = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
