[workspace]
resolver = "2"
members = [
    "crates/tkr-api",
    "crates/tkr-filter",
    "crates/tkr-semantic",
    "crates/tkr-analytics",
    "crates/tkr",
]

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
dirs = "5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
ureq = { version = "2", features = ["json"] }
age = "0.10"
keyring = "3"
schemars = "0.8"
jsonschema = "0.18"
hex = "0.4"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
