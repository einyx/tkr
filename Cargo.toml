[workspace]
resolver = "2"
members = [
    "crates/jkr-api",
    "crates/jkr-filter",
    "crates/jkr-analytics",
    "crates/jkr-session-recorder",
    "crates/jkr-agent",
    "crates/jkr-providers",
    "crates/jkr-sandbox",
    "crates/jkr-mesh",
    "crates/jkr-mcp",
    "crates/jkr-model",
    "crates/jkr-index",
    "crates/jkr",
    "crates/jkr-server",
]

# MSRV — keep in sync with rust-toolchain.toml (transitive crates: time, darling, …).
[workspace.package]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
landlock = "0.4"
tempfile = "3"
regex = "1"
dirs = "5"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
ureq = { version = "3", features = ["json"] }
thiserror = "1"
mockito = "1"
age = "0.11"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
schemars = "0.8"
jsonschema = "0.18"
hex = "0.4"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
sha2 = "0.10"
hkdf = "0.12"
rusqlite = { version = "0.31", features = ["bundled", "serialize"] }
sqlite-vec = "0.1"
# Server-side persistence (jkr-server only):
#   * Postgres for durable, queryable state — sessions, receipts queue,
#     audit rings.
#   * Redis for ephemeral hot state with TTLs — OAuth login state,
#     and (future) rate-limit / proxy-dedupe counters.
# Not pulled into CLI crates: keeps the agent build lean.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "json", "chrono", "uuid"] }
deadpool-redis = { version = "0.18", features = ["rt_tokio_1"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp"] }
tar = "0.4"
flate2 = "1"
# Below 1.52: 1.52.x pulls tokio-macros ~2.7; stale crates.io mirrors sometimes lack it.
tokio = { version = ">=1.51.1, <1.53", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
hyper = { version = "=1.9.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http = "=1.4.0"
http-body-util = "=0.1.3"
bytes = "=1.11.1"
base64 = "=0.22.1"
bollard = "0.21"
futures-util = "0.3"
async-trait = "0.1"

[profile.release]
opt-level = 3
# Disabled: fat/thin LTO can fail when linking `jkr` against `cdylib` workspace
# members and bundled C crates (`rusqlite`) — e.g. `cargo install --path crates/jkr`.
lto = false
codegen-units = 1
strip = true
