[package]
name = "jkr-agent"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Agent runtime for the jkr token-optimized CLI proxy"
repository = "https://github.com/einyx/jkr"
license = "Apache-2.0"

[lib]
name = "jkr_agent"
crate-type = ["rlib"]

[dependencies]
jkr-api = { path = "../jkr-api", version = "0.1.0" }
jkr-filter = { path = "../jkr-filter", version = "0.1.0" }
jkr-sandbox = { path = "../jkr-sandbox", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
jkr-providers = { path = "../jkr-providers" }
