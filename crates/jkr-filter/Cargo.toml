[package]
name = "jkr-filter"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Output filters for the jkr token-optimized CLI proxy"
repository = "https://github.com/einyx/jkr"
license = "Apache-2.0"

[lib]
name = "jkr_filter"
crate-type = ["rlib", "cdylib"]

[dependencies]
jkr-api = { path = "../jkr-api", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
indexmap = "2"
