[package]
name = "jkr-mcp"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "jkr's MCP (Model Context Protocol) server. Exposes structured code-intelligence tools over stdio so AI agents read summaries instead of raw file contents."

[lib]

[[example]]
name = "bench_find_symbol"

[[example]]
name = "bench_read_smart"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
walkdir = "2"
ignore = "0.4"
regex = { workspace = true }
jkr-index = { path = "../jkr-index" }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
