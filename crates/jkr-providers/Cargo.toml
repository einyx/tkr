[package]
name = "jkr-providers"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "LLM provider integrations for the jkr CLI proxy"
repository = "https://github.com/einyx/jkr"
license = "Apache-2.0"

[lib]
name = "jkr_providers"
crate-type = ["rlib"]

[dependencies]
jkr-agent = { path = "../jkr-agent", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
thiserror = { workspace = true }
json5 = "1.3.1"

[dev-dependencies]
mockito = { workspace = true }
