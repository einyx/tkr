[package]
name = "jkr-sandbox"
publish = false
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Sandboxing primitives (landlock/macOS sandbox) for the jkr CLI proxy"
repository = "https://github.com/einyx/jkr"
license = "Apache-2.0"

[lib]
name = "jkr_sandbox"
crate-type = ["rlib"]

[features]
docker = ["dep:bollard", "dep:tokio", "dep:jkr-api", "dep:futures-util", "dep:async-trait"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
bollard = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
jkr-api = { path = "../jkr-api", version = "0.1.0", optional = true }
futures-util = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
rlimit = "0.10"
nix = { version = "0.29", features = ["ptrace", "process", "signal", "fs"] }
syscalls = "0.6"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }
