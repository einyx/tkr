[package]
name = "tkr-agent"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Agent runtime for the tkr token-optimized CLI proxy"
repository = "https://github.com/einyx/tkr"
license = "Apache-2.0"

[lib]
name = "tkr_agent"
crate-type = ["rlib"]

[dependencies]
tkr-api = { path = "../tkr-api", version = "0.1.0" }
tkr-filter = { path = "../tkr-filter", version = "0.1.0" }
tkr-sandbox = { path = "../tkr-sandbox", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tkr-providers = { path = "../tkr-providers", version = "0.1.0" }
