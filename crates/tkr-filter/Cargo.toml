[package]
name = "tkr-filter"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Output filters for the tkr token-optimized CLI proxy"
repository = "https://github.com/einyx/tkr"
license = "Apache-2.0"

[lib]
name = "tkr_filter"
crate-type = ["rlib", "cdylib"]

[dependencies]
tkr-api = { path = "../tkr-api", version = "0.1.0" }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
