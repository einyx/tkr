[package]
name = "tkr-mesh"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Peer messaging mesh for tkr agents — secp256k1 identity, EIP-712 invites, payment-native frames"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
aes-gcm = "0.10"
k256 = { version = "0.13", features = ["ecdsa", "ecdh", "sha256"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha3 = "0.10"
thiserror = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
hex-literal = "0.4"
mockito = { workspace = true }
