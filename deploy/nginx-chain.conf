# nginx server block for chain.prysm.sh → tkr-chain (anvil RPC).
#
# Drop this into /etc/nginx/sites-available/chain.prysm.sh, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Requires DNS for chain.prysm.sh to point at this host, and a TLS cert
# (see certbot block at the end).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chain.prysm.sh;

    # ssl_certificate / ssl_certificate_key managed by certbot or similar.
    # ssl_certificate     /etc/letsencrypt/live/chain.prysm.sh/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chain.prysm.sh/privkey.pem;

    # JSON-RPC via POST /
    location / {
        # CORS so dApp/wallet UIs can call the RPC from any origin.
        # Adjust the allowed origin in production if you want to restrict.
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for `eth_subscribe` etc.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;

        # Read-only RPC: don't tee writes to logs.
        client_max_body_size 1m;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name chain.prysm.sh;
    return 301 https://$host$request_uri;
}

# To provision the cert once DNS is pointing here:
#   sudo certbot --nginx -d chain.prysm.sh
