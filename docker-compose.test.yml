# Test-only compose override. Use ONLY when running the persistence
# integration tests (`crates/tkr-server/tests/persistence.rs`), which
# need host-side access to Postgres + Redis. The base `docker-compose.yml`
# keeps both locked to the compose network for production posture.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d \
#       tkr-postgres tkr-redis
#   TKR_TEST_DATABASE_URL=postgres://tkr:tkr@127.0.0.1:5432/tkr_test \
#   TKR_TEST_REDIS_URL=redis://127.0.0.1:6379/1 \
#       cargo test -p tkr-server --test persistence -- --ignored --test-threads=1
#   docker compose -f docker-compose.yml -f docker-compose.test.yml down
#
# The mappings are loopback-only so even with this override file in
# play the services aren't internet-reachable. Production deploys
# should never apply this overlay.

services:
  tkr-postgres:
    ports:
      - "127.0.0.1:5432:5432"
  tkr-redis:
    ports:
      - "127.0.0.1:6379:6379"
