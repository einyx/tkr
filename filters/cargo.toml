command = "cargo"
subcommands = ["build", "check", "clippy", "test"]

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Compiling "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Downloading "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Downloaded "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Updating "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Locking "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Blocking "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Fresh "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Checking "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Finished "

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Building "

# Drop the trailing `(/path/to/repo/crates/foo)` from cargo's lines that
# survive — saves ~30-60 chars per surviving line.
[[rules]]
type = "truncate_match"
pattern = " \\(/[^)]+\\)$"
replace = ""

# cargo test scaffolding (passing tests are noise — failures are kept)
[[rules]]
type = "suppress_regex"
pattern = "^test [^ ]+ \\.\\.\\. ok$"

[[rules]]
type = "suppress_regex"
pattern = "^running \\d+ tests?$"

[[rules]]
type = "suppress_regex"
pattern = "^test result: ok\\."

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Running unittests"

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Doc-tests "

# cargo tree noise: already-shown deps marked with (*)
[[rules]]
type = "suppress_regex"
pattern = "\\(\\*\\)$"
