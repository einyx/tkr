command = "curl"

# Progress meter header rows
[[rules]]
type = "suppress_regex"
pattern = "^\\s*% Total\\s+% Received"

[[rules]]
type = "suppress_regex"
pattern = "^\\s*Dload\\s+Upload"

# Progress meter data rows: percentage followed by mixed size/time columns.
# Matches lines like "  0  4454k    0 11015 ... --:--:-- 10.9M".
[[rules]]
type = "suppress_regex"
pattern = "^\\s*\\d{1,3}\\s+\\d+[kMG]?\\s+\\d{1,3}\\s+\\d"

# Repeated all-zero / all-dashes initial progress rows
[[rules]]
type = "suppress_regex"
pattern = "^\\s*0\\s+0\\s+0\\s+0\\s+0\\s+0\\s+0"

[[rules]]
type = "suppress_regex"
pattern = "^\\s*--:--:--"
