command = "git"
subcommands = ["diff", "show"]

# `index abc..def 100644` lines — rarely useful for review
[[rules]]
type = "suppress_regex"
pattern = "^index [0-9a-f]+\\.\\.[0-9a-f]+"

# `\\ No newline at end of file` notices
[[rules]]
type = "suppress_regex"
pattern = "^\\\\ No newline at end of file"

# `@@ -123,5 +130,8 @@ context` hunk headers — drop the trailing context
# (the function/section hint) which is often very long. Keep the line numbers.
[[rules]]
type = "truncate_match"
pattern = "^(@@ -\\d+(,\\d+)? \\+\\d+(,\\d+)? @@) .+"
replace = "$1"
