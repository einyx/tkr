# kubectl get/describe in -o yaml: drop chronically verbose fields that an
# LLM almost never needs. Targets: managedFields, resourceVersion, uid,
# selfLink, creationTimestamp, generation, etc. Both at top level and nested.
command = "kubectl"
subcommands = ["get", "describe", "edit"]

# Single-line scalar fields that pure noise
[[rules]]
type = "suppress_regex"
pattern = "^\\s+(resourceVersion|uid|selfLink|generation|observedGeneration):"

[[rules]]
type = "suppress_regex"
pattern = "^\\s+creationTimestamp:"

# Annotations like kubectl.kubernetes.io/last-applied-configuration
[[rules]]
type = "suppress_regex"
pattern = "^\\s+kubectl\\.kubernetes\\.io/last-applied-configuration:"

# `managedFields:` block — entire block until next sibling key.
# Catch the start; collapse_run with ignore_blanks suppresses the indented body.
[[rules]]
type = "suppress_regex"
pattern = "^\\s+managedFields:"

# Indented children of suppressed managedFields — match deep indentation
[[rules]]
type = "collapse_run"
pattern = "^\\s{4,}-?\\s"
keep_first = 0
ignore_blanks = true

# `status:` blocks for kubectl describe are usually long and noisy
[[rules]]
type = "suppress_regex"
pattern = "^\\s+lastTransitionTime:"

# Drop `time:` timestamp lines in events/conditions
[[rules]]
type = "suppress_regex"
pattern = "^\\s+time:\\s+\\d{4}-\\d{2}-\\d{2}T"
