command = "npm"
subcommands = ["install", "ci", "run"]

# Drop deprecation warnings — peer-dep mismatches and "deprecated foo@x.y"
# lines are the bulk of npm install output and rarely actionable from
# the LLM's perspective. Real errors (`npm err!` / `npm error`) survive
# since they don't match this prefix.
[[rules]]
type = "suppress_regex"
pattern = "^npm warn "

# Drop the dependency-funding banner and follow-up.
[[rules]]
type = "suppress_regex"
pattern = "^\\s*\\d+ packages are looking"

[[rules]]
type = "suppress_regex"
pattern = "^\\s*run `npm fund`"

# Drop `npm notice` lines (advisories that don't block).
[[rules]]
type = "suppress_regex"
pattern = "^npm notice "

# Drop progress/spinner lines that survived TTY detection.
[[rules]]
type = "suppress_regex"
pattern = "^\\s*\\[#+\\s*\\] "

# Note: the `added N packages in Ts` success summary is intentionally
# kept (no rule matches it). It's the one line the LLM actually wants
# to confirm an install succeeded.
