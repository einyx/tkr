command = "rg"

# rg's --stats mode adds summary lines that are noise unless asked for
[[rules]]
type = "suppress_regex"
pattern = "^\\d+ matched lines?$"

[[rules]]
type = "suppress_regex"
pattern = "^\\d+ files? contained matches"

[[rules]]
type = "suppress_regex"
pattern = "^\\d+ files? searched"

[[rules]]
type = "suppress_regex"
pattern = "^\\d+ bytes printed"

[[rules]]
type = "suppress_regex"
pattern = "^[\\d.]+ seconds spent searching"

[[rules]]
type = "suppress_regex"
pattern = "^[\\d.]+ seconds$"

# Cap long match lines (minified JS, JSON blobs).
[[rules]]
type = "truncate_long"
max_len = 200

# Group remaining matches by file. rg emits "path:line:content".
[[rules]]
type = "group_by_capture"
pattern = "^([^:]+):"
key_capture = 1
cap_per_key = 2
total_cap = 50
header = "rg matches by file:"

# Empty-result marker. Must be final.
[[rules]]
type = "empty_result_substitute"
message = "0 rg matches"
